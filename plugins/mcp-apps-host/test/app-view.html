<!doctype html>
<html>
<head><meta charset="utf-8"><title>spike app</title></head>
<body style="font-family:system-ui;padding:16px">
<h3>Counter App（MCP-Apps spike）</h3>
<p style="font-size:13px;color:#555">这是 server 通过 <code>ui://</code> 资源分发的 HTML app。它用<strong>裸 postMessage JSON-RPC</strong> 与宿主通信（spec 示例实现，无 SDK）。</p>
<div>
  <button id="inc">计数 +1</button> <span id="count">0</span>
  <button id="hello">调用 server 工具 echo</button>
  <button id="sample">试探 sampling（应被拒）</button>
</div>
<pre id="log" style="background:#f6f8fa;border:1px solid #e2e8f0;padding:8px;font-size:12px;max-height:220px;overflow:auto"></pre>
<script>
var nextId = 1;
function log(s) {
  var el = document.getElementById('log');
  el.textContent += s + '\n';
  el.scrollTop = el.scrollHeight;
}
function sendRequest(method, params) {
  var id = nextId++;
  window.parent.postMessage({ jsonrpc: '2.0', id: id, method: method, params: params }, '*');
  return new Promise(function (resolve, reject) {
    var listener = function (event) {
      var d = event.data;
      if (d && d.id === id) {
        window.removeEventListener('message', listener);
        if (d.result) resolve(d.result);
        else reject(new Error((d.error && d.error.message) || JSON.stringify(d.error)));
      }
    };
    window.addEventListener('message', listener);
  });
}
var count = 0;
document.getElementById('inc').onclick = function () {
  count++;
  document.getElementById('count').textContent = count;
};
document.getElementById('hello').onclick = function () {
  sendRequest('tools/call', { name: 'echo', arguments: { text: 'hello from MCP app' } })
    .then(function (r) { log('tools/call echo → ' + JSON.stringify(r)); })
    .catch(function (e) { log('tools/call 失败: ' + e.message); });
};
document.getElementById('sample').onclick = function () {
  sendRequest('sampling/createMessage', { messages: [{ role: 'user', content: { type: 'text', text: 'hi' } }] })
    .then(function (r) { log('sampling → ' + JSON.stringify(r)); })
    .catch(function (e) { log('sampling 被拒（预期）: ' + e.message); });
};
(function () {
  sendRequest('initialize', { capabilities: {}, clientInfo: { name: 'spike-app', version: '0.0.1' }, protocolVersion: '2025-06-18' })
    .then(function (init) {
      log('initialize → ' + JSON.stringify(init));
      return sendRequest('ui/initialize', { appCapabilities: { tools: { listChanged: false } } });
    })
    .then(function (ui) {
      log('ui/initialize → hostCapabilities=' + JSON.stringify(ui.hostCapabilities));
      return sendRequest('tools/list', {});
    })
    .then(function (tools) {
      log('tools/list → ' + (tools.tools || []).map(function (t) { return t.name; }).join(', '));
    })
    .catch(function (e) { log('握手失败: ' + e.message); });
})();
</script>
</body>
</html>
