<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作台 · workbench</title>
<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --border: #e3e6eb; --text: #1f2430; --muted: #6b7280;
  --accent: #2563eb; --accent-soft: #eff6ff; --ok: #16a34a; --warn: #d97706; --danger: #dc2626;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14171d; --surface: #1c2129; --border: #2b323d; --text: #e8eaf0; --muted: #9aa3b2; --accent-soft: #1e2a44; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; padding: 20px; }
header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
h1 { font-size: 20px; font-weight: 700; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px 12px; font-size: 12px; color: var(--muted); }
.chip b { color: var(--text); }
.muted { color: var(--muted); font-size: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; }
.card h3 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; }
input[type=text], textarea { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font: inherit; background: var(--bg); color: var(--text); }
textarea { resize: vertical; min-height: 60px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > * { flex: 1 1 auto; }
.row .narrow { flex: 0 0 auto; }
button { border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button:hover { opacity: .85; }
ul { list-style: none; }
li { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
li:last-child { border-bottom: none; }
li .check { width: 18px; height: 18px; margin-top: 2px; cursor: pointer; flex-shrink: 0; }
li .body { flex: 1; min-width: 0; }
li .title { font-weight: 600; }
li .title.done { text-decoration: line-through; color: var(--muted); }
li .content { color: var(--muted); font-size: 13px; white-space: pre-wrap; word-break: break-word; }
li .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
li .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
li .tag { background: var(--accent-soft); color: var(--accent); padding: 1px 7px; border-radius: 4px; font-size: 11px; }
.empty { color: var(--muted); text-align: center; padding: 24px 0; }
#toast { position: fixed; right: 16px; bottom: 16px; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; box-shadow: 0 8px 24px rgba(0,0,0,.12); font-size: 13px; transform: translateY(140%); transition: transform .25s; z-index: 50; }
#toast.show { transform: translateY(0); }
</style>
</head>
<body>
<header>
  <h1>工作台</h1>
  <div class="chips">
    <span class="chip">共 <b id="cnt">0</b> 条</span>
    <span class="chip">已完成 <b id="cntDone">0</b></span>
  </div>
</header>

<div class="card">
  <h3>新建条目</h3>
  <div class="row" style="margin-bottom:10px">
    <input type="text" id="f-title" placeholder="标题（必填）">
  </div>
  <div class="row" style="margin-bottom:10px">
    <textarea id="f-content" placeholder="正文内容（可选）"></textarea>
  </div>
  <div class="row">
    <input type="text" id="f-tags" placeholder="标签，逗号分隔（可选）" class="narrow" style="flex:1">
    <button class="primary" onclick="createItem()">创建</button>
  </div>
</div>

<div class="card">
  <h3>条目列表</h3>
  <ul id="list"></ul>
</div>

<div id="toast"></div>

<script>
const API = '/api/workbench';
let pollTimer = null;

function toast(msg, ok = true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderLeft = ok ? '3px solid var(--ok)' : '3px solid var(--danger)';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

async function refresh() {
  try {
    const r = await fetch(API + '/state');
    const d = await r.json();
    if (!d.ok) return;
    render(d.data);
  } catch (e) { /* 静默，下次轮询 */ }
}

function render(store) {
  const items = store.items || [];
  document.getElementById('cnt').textContent = items.length;
  document.getElementById('cntDone').textContent = items.filter(i => i.done).length;
  const ul = document.getElementById('list');
  if (!items.length) {
    ul.innerHTML = '<div class="empty">还没有条目，在上方创建第一个</div>';
    return;
  }
  ul.innerHTML = items.map(i => `
    <li>
      <input type="checkbox" class="check" ${i.done ? 'checked' : ''} onchange="toggleDone('${i.id}', ${!i.done})">
      <div class="body">
        <div class="title ${i.done ? 'done' : ''}">${esc(i.title)}</div>
        ${i.content ? `<div class="content">${esc(i.content)}</div>` : ''}
        ${i.tags && i.tags.length ? `<div class="tags">${i.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join('')}</div>` : ''}
        <div class="meta">${i.id} · 更新 ${i.updatedAt}</div>
      </div>
    </li>
  `).join('');
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function createItem() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { toast('标题必填', false); return; }
  const content = document.getElementById('f-content').value.trim();
  const tags = document.getElementById('f-tags').value.split(',').map(s => s.trim()).filter(Boolean);
  try {
    const r = await fetch(API + '/mutate', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ op: 'create_item', args: { title, content, tags } }),
    });
    const d = await r.json();
    if (d.ok) {
      document.getElementById('f-title').value = '';
      document.getElementById('f-content').value = '';
      document.getElementById('f-tags').value = '';
      toast('已创建');
      render(d.state);
    } else {
      toast(d.error || '创建失败', false);
    }
  } catch (e) { toast('请求失败：' + e, false); }
}

async function toggleDone(id, done) {
  try {
    const r = await fetch(API + '/mutate', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ op: 'update_item', args: { id, done } }),
    });
    const d = await r.json();
    if (d.ok) render(d.state); else toast(d.error || '更新失败', false);
  } catch (e) { toast('请求失败：' + e, false); }
}

refresh();
pollTimer = setInterval(refresh, 3000);
</script>
</body>
</html>
