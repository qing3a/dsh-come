name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # tray-icon（Linux 托盘）依赖 GTK/GLib 系统库
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get update && sudo apt-get install -y libgtk-3-dev libglib2.0-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --release

      - name: cargo test
        run: cargo test --release

      - name: cargo build --release
        run: cargo build --release
