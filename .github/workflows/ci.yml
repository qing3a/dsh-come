name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  hlp-plugin-check:
    # 需要 Secret DEPLOY_SSH_KEY（可读私有仓 harness-localapp 的 SSH 私钥）；
    # 未配置时跳过（本地发版前手动跑 node scripts/sync-hlp-plugin.mjs 同样校验）
    if: ${{ secrets.DEPLOY_SSH_KEY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 拉取 HLP 开发仓库（同账号私有仓）以同步最新插件
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: \${{ secrets.DEPLOY_SSH_KEY }}
      - name: 信任 github.com 主机密钥
        run: mkdir -p ~/.ssh && ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
      - name: 拉取 HLP 开发仓库
        run: git clone --depth 1 git@github.com:qing3a/harness-localapp.git ../Harness-LocalApp
      - name: 同步并校验 HLP 插件
        run: node scripts/sync-hlp-plugin.mjs --hlp-path ../Harness-LocalApp

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # tray-icon（Linux 托盘）依赖 GTK/GLib 系统库
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get update && sudo apt-get install -y libgtk-3-dev libglib2.0-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --release

      - name: cargo test
        run: cargo test --release

      - name: cargo build --release
        run: cargo build --release
