[package]
name = "dsh-come"
version = "0.2.0"
edition = "2021"
description = "DSH 伴侣：把系统 dsh 变成双击即用的 Windows 桌面 App（直启系统 dsh + 崩溃自愈 + 托盘）"
license = "MIT"

[dependencies]
# 系统托盘
tray-icon = "0.24"
winit = "0.30"
# 配置 config.json
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 日志时间戳
chrono = "0.4"
# HTTP：引擎就绪探测
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
# 桌面通知（崩溃/重启/达上限弹窗；失败静默降级，不阻塞守护）
notify-rust = "4"
# Ctrl+C 优雅退出（--no-tray / 托盘降级无头模式）
ctrlc = "3"
# 自动更新：下载后 SHA256 校验（update.json 比对；无签名分发，HTTPS + 哈希防中间人）
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# 单实例锁（named mutex）+ 注册表 PATH 读取（installer 探测）
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
# 进程组杀树（kill -pgid）、单实例 flock 锁、可执行位检测（access X_OK）
libc = "0.2"

[build-dependencies]
# 把 resources/icon.ico 嵌入 exe（资源管理器/任务栏图标）
embed-resource = "3"

[dev-dependencies]
# （已无 dev 工具；icon.ico 是提交的静态资产，由 build.rs 嵌入 exe）

[profile.release]
strip = true
