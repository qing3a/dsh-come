<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg">
<title>DSH 伴侣 · 运行状态</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel2: #1e222c;
    --text: #e8eaf0;
    --muted: #9aa2b1;
    --accent: #4f6ef7;
    --ok: #34c759;
    --err: #ff5c5c;
    --warn: #f59e0b;
    --border: #262b38;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    padding: 28px;
    max-width: 860px;
    margin: 0 auto;
  }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
  .logo { width: 40px; height: 40px; }
  h1 { font-size: 20px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 24px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; margin-bottom: 14px; color: var(--muted); font-weight: 600; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; font-size: 14px; border-bottom: 1px solid #20242e; }
  .row:last-child { border-bottom: none; }
  .row .label { color: var(--muted); }
  .row .value { font-family: Consolas, monospace; font-size: 13px; word-break: break-all; text-align: right; }
  .badge { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge-ok { background: rgba(52,199,89,.14); color: var(--ok); }
  .badge-err { background: rgba(255,92,92,.14); color: var(--err); }
  .badge-warn { background: rgba(245,158,11,.14); color: var(--warn); }
  .badge-muted { background: var(--panel2); color: var(--muted); }

  a.btn {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 13px;
  }
  a.btn:hover { opacity: .9; }

  .loglines {
    background: #0b0d11;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: Consolas, monospace;
    font-size: 12px;
    line-height: 1.7;
    color: #b8c0cc;
    max-height: 260px;
    overflow: auto;
    white-space: pre-wrap;
  }
  .empty { color: var(--muted); font-style: italic; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 12px; color: var(--muted); }
  .meta { color: var(--muted); font-size: 12px; margin-top: 18px; line-height: 1.8; }
  .meta span { font-family: Consolas, monospace; }
</style>
</head>
<body>
<header>
  <img class="logo" src="/favicon.svg" alt="DSH">
  <div>
    <h1>DSH 伴侣 · 运行状态</h1>
    <p class="sub">自动刷新（1.5s）· 详情见日志目录</p>
  </div>
</header>

<div class="card">
  <h2>引擎</h2>
  <div class="row"><span class="label">运行状态</span><span id="engine-state" class="value"><span class="badge badge-muted">…</span></span></div>
  <div class="row"><span class="label">监听地址</span><span id="engine-url" class="value">…</span></div>
  <div class="row"><span class="label">进程 PID</span><span id="engine-pid" class="value">—</span></div>
  <div class="row"><span class="label">阶段提示</span><span id="engine-stage" class="value">—</span></div>
  <div class="row"><span class="label">连续重启</span><span id="engine-restarts" class="value">0</span></div>
  <div class="row"><span class="label">最近错误</span><span id="engine-error" class="value">—</span></div>
  <div class="row" style="border:none; margin-top:6px;"><a id="btn-open" class="btn" href="#">打开界面</a></div>
</div>

<div class="card">
  <h2>版本</h2>
  <div class="row"><span class="label">当前锁定版本</span><span id="ver-current" class="value">—</span></div>
  <div class="row"><span class="label">待确认更新</span><span id="ver-pending" class="value">—</span></div>
  <div class="row"><span class="label">失败记录</span><span id="ver-known-bad" class="value">—</span></div>
</div>

<div class="card">
  <h2>已安装插件（<span id="plugin-count">0</span>）</h2>
  <div id="plugins" class="chips"><span class="chip empty">暂无插件</span></div>
</div>

<div class="card">
  <h2>工作台（<span id="wb-count">0</span>）</h2>
  <div id="workbenches" class="chips"><span class="chip empty">市场暂无工作台</span></div>
</div>

<div class="card">
  <h2>引擎日志（尾部）</h2>
  <div id="logs" class="loglines empty">读取中…</div>
</div>

<p class="meta">
  数据根目录 <span id="dir-root">—</span><br>
  工作区 <span id="dir-home">—</span><br>
  日志目录 <span id="dir-logs">—</span>
</p>

<script>
  const $ = (id) => document.getElementById(id);
  let engineUrl = "http://127.0.0.1:3080";

  function badge(kind, text) {
    return `<span class="badge badge-${kind}">${text}</span>`;
  }

  async function poll() {
    try {
      const s = await (await fetch("/desktop/api/status")).json();

      // 引擎
      let stateHtml;
      if (s.engine.ready) stateHtml = badge("ok", "运行中 ✓");
      else if (s.engine.running) stateHtml = badge("warn", "启动中…");
      else if (s.engine.last_error) stateHtml = badge("err", "已停止 ✗");
      else stateHtml = badge("muted", "已停止");
      $("engine-state").innerHTML = stateHtml;

      engineUrl = s.engine_url || engineUrl;
      $("engine-url").textContent = engineUrl;
      $("engine-pid").textContent = s.engine.pid || "—";
      $("engine-stage").textContent = s.engine.stage || (s.engine.flash || "—");
      $("engine-restarts").textContent = s.engine.restarts;
      $("engine-error").textContent = s.engine.last_error || "—";
      $("btn-open").href = engineUrl;

      // 版本
      $("ver-current").textContent = s.version.current || "未安装";
      $("ver-pending").textContent = s.version.pending ? `v${s.version.pending}（托盘菜单应用更新）` : "—";
      $("ver-known-bad").textContent = s.version.known_bad.length ? s.version.known_bad.join("、") : "—";

      // 插件
      $("plugin-count").textContent = s.plugins.length;
      $("plugins").innerHTML = s.plugins.length
        ? s.plugins.map((p) => `<span class="chip">${p}</span>`).join("")
        : `<span class="chip empty">暂无插件</span>`;

      // 工作台：名称 + 场景 + 就绪状态（本地资产存在/URL 可用）+ 验证证据；entry 存在则可点击打开
      $("wb-count").textContent = (s.workbenches || []).length;
      $("workbenches").innerHTML = (s.workbenches || []).length
        ? s.workbenches.map((w) => {
            const ok = w.present;
            const name = `${w.name} v${w.version} ${w.scenario ? `（${w.scenario}）` : ""}`;
            const evidence = w.verify_evidence
              ? `<span class="chip" style="color:var(--muted);">验证：${w.verify_evidence}</span>`
              : "";
            const body = w.requires && w.requires.length
              ? `<span class="chip" style="color:var(--muted);">依赖：${w.requires.join("、")}</span>`
              : "";
            const status = ok ? badge("ok", "就绪") : badge("err", "资产缺失");
            const link = w.entry && ok ? `<a class="chip" style="color:var(--accent);" href="${w.entry}">打开 →</a>` : "";
            return `<span class="chip">${name} ${status}</span>${evidence}${body}${link}`;
          }).join(" ")
        : `<span class="chip empty">市场暂无工作台</span>`;

      // 日志
      $("logs").textContent = s.logs && s.logs.length ? s.logs.join("\n") : "（空）";

      // 目录
      $("dir-root").textContent = s.dirs.root;
      $("dir-home").textContent = s.dirs.home;
      $("dir-logs").textContent = s.dirs.logs;
    } catch (e) { /* 服务暂不可达，下轮再试 */ }
  }

  poll();
  setInterval(poll, 1500);
</script>
</body>
</html>
